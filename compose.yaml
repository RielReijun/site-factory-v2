name: site-factory

x-base: &base
  build:
    context: .
    dockerfile: Dockerfile
  working_dir: /workspace
  env_file: .env
  environment:
    PYTHONUNBUFFERED: "1"
  volumes:
    - ./app:/workspace/app
    - ./data:/workspace/data
    - ./output:/workspace/output
    - ./prompts:/workspace/prompts
    - ./scripts:/workspace/scripts

services:
  worker:
    <<: *base
    container_name: site-factory-worker
    tty: true
    stdin_open: true
    command: bash

  dashboard:
    <<: *base
    container_name: site-factory-dashboard
    ports:
      - "8181:8181"
    command: python /workspace/app/server.py
    restart: unless-stopped

  scheduler:
    <<: *base
    container_name: site-factory-scheduler
    command: >
      bash -c "
        echo '[INFO] Scheduler gestart — pipeline draait elk uur';
        while true; do
          python /workspace/scripts/run_pipeline.py --auto || true;
          echo '[INFO] Wachten tot volgende run...';
          sleep 3600;
        done
      "
    restart: unless-stopped
