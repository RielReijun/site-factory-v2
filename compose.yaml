name: site-factory

x-base: &base
  build:
    context: .
    dockerfile: Dockerfile
  working_dir: /workspace
  env_file: .env
  environment:
    PYTHONUNBUFFERED: "1"
  volumes:
    - ./app:/workspace/app
    - ./data:/workspace/data
    - ./output:/workspace/output
    - ./prompts:/workspace/prompts:ro
    - ./scripts:/workspace/scripts:ro

services:
  worker:
    <<: *base
    container_name: site-factory-worker
    tty: true
    stdin_open: true
    command: bash
    volumes:
      - ./app:/workspace/app
      - ./data:/workspace/data
      - ./output:/workspace/output
      - ./prompts:/workspace/prompts
      - ./scripts:/workspace/scripts
    deploy:
      resources:
        limits:
          memory: 4g

  dashboard:
    <<: *base
    container_name: site-factory-dashboard
    ports:
      - "8181:8181"
    command: python /workspace/app/server.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8181/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m

  scheduler:
    <<: *base
    container_name: site-factory-scheduler
    command: >
      bash -c "
        echo '[INFO] Scheduler gestart — pipeline draait elk uur';
        while true; do
          if python /workspace/scripts/run_pipeline.py --auto; then
            echo '[OK] Pipeline run geslaagd';
          else
            echo '[WARN] Pipeline run mislukt (exit '$?') — scheduler gaat door';
          fi
          echo '[INFO] Wachten tot volgende run...';
          sleep 3600;
        done
      "
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4g
